<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151F">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Sport Trader Journal</title>
<style>
:root{--bg:#10151F;--p:#1A2230;--l:#2B3648;--t:#E8EDF5;--m:#8A97AB;--g:#3DDC97;--r:#FF6B6B;--a:#FFC14D;--b:#5BA8FF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:12px 14px 80px}
nav{display:flex;gap:6px;margin-bottom:12px}nav button{flex:1;padding:10px 4px;border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:10px;font-weight:600}
nav button.on{color:var(--t);border-color:var(--b)}
section{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--m);margin:6px 0 2px}
input,select,textarea{width:100%;padding:9px;background:var(--bg);border:1px solid var(--l);border-radius:8px;color:var(--t);font:inherit}
textarea{height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center;margin-top:4px}
button.pri{width:100%;padding:13px;margin-top:8px;border:0;border-radius:10px;background:var(--b);color:#08101C;font-weight:700;font-size:15px}
button.sec{padding:8px 12px;border:1px solid var(--l);background:none;color:var(--t);border-radius:8px}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--m)}.kv b{color:var(--t);font-variant-numeric:tabular-nums}
.tr{border-top:1px solid var(--l);padding:8px 0;display:flex;justify-content:space-between;gap:8px}small{color:var(--m)}
#msg{color:var(--m);font-size:13px;margin-top:6px}.hid{display:none}svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;text-align:right;border-top:1px solid var(--l)}th{color:var(--m);font-weight:600}td:first-child,th:first-child{text-align:left}
</style></head><body><main>
<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><img src="icon-192.png" width="42" height="42" alt="" style="border-radius:10px"><b style="font-size:18px">Sport Trader Journal</b></div>
<nav><button id="n1" class="on">Nuovo</button><button id="n2">Journal</button><button id="n3">Andamento</button></nav>
<div id="v1">
<section><h2>Strategia</h2><select id="st"></select></section>
<section><h2>Alert Telegram</h2><textarea id="al" placeholder="Incolla qui l'alert"></textarea>
<button class="pri" id="rd">Leggi alert</button><div id="msg"></div></section>
<section><h2>Trade</h2>
<label>Data</label><input type="date" id="dt">
<label>Partita</label><input id="pa">
<div class="row"><div><label>Lega</label><input id="le"></div><div><label>Punteggio</label><input id="pu"></div></div>
<div class="row"><div><label>Tipo</label><select id="ti"><option>BACK</option><option>LAY</option></select></div><div><label>Bookmaker</label><select id="bm"></select></div></div>
<div class="row"><div><label>% Rischio</label><select id="rk"></select></div><div><label>Tranche usate (auto)</label><select id="sp" disabled></select></div></div>
<small id="sg"></small>
<div class="row"><div><label>Min ingresso</label><input id="mi" inputmode="numeric"></div><div><label>Min uscita</label><input id="mo" inputmode="numeric"></div></div>
<label id="ls">Strike rate % (dall'alert, per l'EV)</label><input id="sr" inputmode="decimal" placeholder="es. 92">
</section>
<section><h2 id="th">Tranche</h2><div id="tr"></div>
<div class="row"><div><label>Commissione %</label><input id="co" inputmode="decimal" value="5"></div><div><label>Soglia red up % stake</label><input id="rs" inputmode="decimal" value="50"></div></div>
<label id="lq">Quota di uscita (banco Over)</label><input id="qe" inputmode="decimal" placeholder="es. 1.20">
<div class="row"><div><label>Tipo uscita</label><select id="tu"></select></div><div><label>Emozione 1-5</label><select id="em"></select></div></div>
<label>P&L € (auto per BACK, modificabile)</label><input id="pl" inputmode="decimal">
<div class="row" style="margin-top:6px"><button class="sec" id="hw">Tenuto: vinto</button><button class="sec" id="hl">Tenuto: perso</button></div>
</section>
<section><div class="big" id="pc">–</div><div id="stt" class="a">Inserisci tranche e uscita</div>
<div class="kv"><span>Quota media</span><b id="av">–</b></div><div class="kv"><span>Stake / rischio</span><b id="sk">–</b></div>
<div class="kv"><span>EV all'entrata</span><b id="evk">–</b></div><div class="kv"><span>Pareggio a</span><b id="be">–</b></div><div class="kv"><span>Red up a</span><b id="ru">–</b></div>
<button class="pri" id="sv">Salva nel journal</button></section>
</div>
<div id="v2" class="hid"><section><h2>Trade salvati</h2><div id="ls"></div>
<div class="row" style="margin-top:10px"><button class="sec" id="cp">Copia nuovi</button><button class="sec" id="ca">Copia tutti</button></div>
<button class="sec" id="cs" style="margin-top:8px;width:100%">Scarica CSV</button>
<button class="sec" id="rz" style="margin-top:8px;width:100%;color:var(--r)">Azzera tutti i trade</button>
<h2 style="margin-top:14px">Strategie</h2><div id="sl"></div><button class="sec" id="sa" style="margin-top:8px;width:100%">+ Aggiungi strategia</button>
<label>Bankroll iniziale (€)</label><input id="b0" inputmode="decimal"></section></div>
<div id="v3" class="hid"><section><h2>Andamento bankroll</h2><div id="ch"></div></section><section><h2>Statistiche</h2><div id="ks"></div></section><section><h2>Per strategia</h2><div id="bs"></div></section></div>
</main>
<script>
const $=i=>document.getElementById(i),KEY='splittrader_journal',SK='splittrader_set';
const opt=a=>a.map(x=>`<option>${x}</option>`).join(''),blank='<option></option>';
const STR=['Split Over 1.5','Split Over 2.5','Split Over 3.5','Split Over HT','Over 0.5','Over 1.5','Over 2.5','Over 3.5','FHG 0.5','Lay Sfavorita','Lay The Draw','Over 1.5 HT','FHG Double','Over Successivo'];
const PROF={'Split Over 1.5':'BACK','Split Over 2.5':'BACK','Split Over 3.5':'BACK','Split Over HT':'BACK','Over 0.5':'BACK','Over 1.5':'BACK','Over 2.5':'BACK','Over 3.5':'BACK','Lay Sfavorita':'LAY','Lay The Draw':'LAY','FHG 0.5':'BACK','Over 1.5 HT':'BACK','FHG Double':'BACK','Over Successivo':'BACK'};
const MAP=[[/SPLIT OVER/,'Split Over 1.5','BACK']];
const set=Object.assign({bm:'Betfair',rk:'1',b0:''},JSON.parse(localStorage.getItem(SK)||'{}')),saveSet=()=>localStorage.setItem(SK,JSON.stringify(set));
const SS='splittrader_strat2';
let strat=JSON.parse(localStorage.getItem(SS)||'null')||STR.map(n=>({n,t:PROF[n]||''}));
const saveStrat=()=>localStorage.setItem(SS,JSON.stringify(strat)),profT=n=>(strat.find(x=>x.n===n)||{}).t||'';
function fillSt(){const v=$('st').value;$('st').innerHTML='<option value="">— scegli strategia —</option>'+opt(strat.map(x=>x.n));$('st').value=v}fillSt();$('bm').innerHTML=opt(['Betfair','Betflag','SharpX','BlackFair']);$('rk').innerHTML=opt(['0.5','1','2','3','5']);$('sp').innerHTML=opt(['1','2','3','4']);
$('tu').innerHTML=blank+opt(['W','L1','L2','FreeBet']);$('em').innerHTML=blank+opt(['1','2','3','4','5']);
$('bm').value=set.bm;$('rk').value=set.rk;$('b0').value=set.b0;$('dt').valueAsDate=new Date();
$('tr').innerHTML=[1,2,3,4].map(i=>`<div class="row3"><span>${i}</span><input id="q${i}" inputmode="decimal" placeholder="quota"><input id="s${i}" inputmode="decimal" placeholder="stake €"></div>`).join('');
function parse(raw,forced){const text=raw.replace(/\r/g,''),clean=s=>s.replace(/[^\p{L}\p{N}\s.'’′\-–:&()\/]/gu,'').replace(/\s+/g,' ').trim();
const lines=text.split('\n').map(l=>l.trim()).filter(Boolean),o={partita:'',lega:'',punteggio:'',minuto:'',quota:'',tipo:'',strategia:'',sr:''};
const title=clean(lines[0]||'').toUpperCase();for(const [re,s,t] of MAP)if(re.test(title)){o.strategia=s;o.tipo=t;break}
if(forced){o.strategia=forced;o.tipo=profT(forced)}
for(const l of lines)if(l.includes('🏆')){o.lega=clean(l.replace('🏆',''));break}
let m;for(const l of lines)if(m=clean(l).match(/^(.+?)\s+vs\.?\s+(.+)$/i)){o.partita=m[1]+' - '+m[2];break}
for(const l of lines){const c=clean(l);if(/^(Score|Corners|Shots|xG|Odds|Live|Kick)/i.test(c))continue;
if(m=c.match(/^(.+?)\s+(\d+)\s*[–\-:]\s*(\d+)\s+(.+)$/)){if(!o.partita)o.partita=m[1]+' - '+m[4];o.punteggio=m[2]+'-'+m[3];break}}
if(!o.punteggio&&(m=text.match(/Score(?:\s*HT)?\s*:?\s*(\d+)\s*[:\-–]\s*(\d+)/i)))o.punteggio=m[1]+'-'+m[2];
if(o.strategia==='Draw Balance')o.punteggio='0-0';
if((m=text.match(/(?:Minuto:?\s*|⏱\uFE0F?\s*)(\d+)\s*['’′]/u))||(m=text.match(/(\d+)\s*['’′]/)))o.minuto=m[1];
if(o.strategia==='Draw Balance'&&(m=text.match(/Live[^\n]*\n\s*([\d.,]+)\s*-\s*([\d.,]+)\s*-\s*([\d.,]+)/i)))o.quota=m[2].replace(',','.');
if(m=text.match(/Strike Rate:?\s*(\d+(?:[.,]\d+)?)\s*%/i))o.sr=m[1].replace(',','.');
return o}
$('rd').onclick=()=>{const o=parse($('al').value,$('st').value);if(!o.partita){$('msg').textContent='Partita non riconosciuta: controlla il testo incollato.';return}
$('pa').value=o.partita;$('le').value=o.lega;$('pu').value=o.punteggio;$('mi').value=o.minuto;if(o.strategia)$('st').value=o.strategia;if(o.tipo)$('ti').value=o.tipo;
if(o.quota)$('q1').value=o.quota;if(o.sr)$('sr').value=o.sr;plM=false;$('msg').textContent='Compilato. Controlla i campi'+(o.quota?'':' e inserisci la quota delle tranche')+'.';calc()};
const n=i=>parseFloat(String($(i).value).replace(',','.')),f2=x=>isFinite(x)?x.toFixed(2):'–',load=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
let plM=false,cur=null,curEv='',cs=null;
const B0=()=>parseFloat(String(set.b0).replace(',','.'))||0;
const bankNow=()=>B0()+load().reduce((a,t)=>a+(+t.pl||0),0);
function calc(){const lay=$('ti').value==='LAY';let S=0,R=0,cnt=0;
for(let i=1;i<=4;i++){const q=n('q'+i),s=n('s'+i);if(q>0&&s>0){S+=s;R+=q*s;cnt++}}
const risk=S?(lay?R-S:S):0,av=S?R/S:0;if(cnt)$('sp').value=String(cnt);
$('th').textContent=lay?'Tranche (lay: quota e stake)':'Tranche (back)';
$('lq').textContent=lay?'Quota di uscita (punti il back)':'Quota di uscita (banco Over)';
$('ls').textContent=lay?"Strike rate % (vince il lay, per l'EV)":"Strike rate % (vince il back, per l'EV)";
const sr=n('sr')/100;let ev=NaN;if(S&&sr>0&&sr<=1)ev=lay?sr*S-(1-sr)*risk:sr*R-S;curEv=isFinite(ev)?ev:'';
$('evk').textContent=isFinite(ev)?(ev>=0?'+':'')+f2(ev)+' € ('+(ev/risk*100).toFixed(1)+'%)':'–';
const c=(n('co')||0)/100,rt=(n('rs')||50)/100,qe=n('qe');cs={S,R,risk,lay,c};
if(!plM){if(S&&qe>0){const g=lay?S-R/qe:R/qe-S;$('pl').value=(g>0?g*(1-c):g).toFixed(2)}else $('pl').value=''}
const sg=$('sg');if(B0()>0){const r=+$('rk').value/100,b=bankNow();const x=lay?(n('q1')>1?b*r/(n('q1')-1):0):b*r;sg.textContent='Bankroll '+f2(b)+' € · stake suggerito '+(x?f2(x)+' €':'–')}else sg.textContent='';
$('sk').textContent=S?f2(S)+' / '+f2(risk)+' €':'–';$('av').textContent=S?f2(av):'–';
$('be').textContent=S?f2(av):'–';$('ru').textContent=S?f2(lay?av/(1+rt*(av-1)):av/(1-rt)):'–';
const pl=n('pl');cur=null;
if(!(risk>0&&isFinite(pl))){$('pc').textContent='–';$('pc').className='big';$('stt').className='a';$('stt').textContent='Inserisci uscita o P&L';return}
const pc=pl/risk;cur={risk,pc,pl};$('pc').textContent=(pc*100).toFixed(1)+'%';
const cls=pl>0?'g':pc<=-rt?'r':'a';$('pc').className='big '+cls;$('stt').className=cls;
$('stt').textContent=(pl>=0?'+':'')+f2(pl)+' € · '+(pl>0?'Green up':pc<=-rt?'Red up: soglia raggiunta':'In perdita, sotto soglia')}
function hold(win){if(!cs||!cs.S){$('msg').textContent='Inserisci prima le tranche.';return}
const g=win?(cs.lay?cs.S:cs.R-cs.S):-cs.risk;$('pl').value=(win?g*(1-cs.c):g).toFixed(2);plM=true;calc()}
$('hw').onclick=()=>hold(true);$('hl').onclick=()=>hold(false);
$('pl').addEventListener('input',()=>{plM=$('pl').value!==''});
document.querySelectorAll('#v1 input,#v1 select').forEach(e=>e.addEventListener('input',calc));
$('st').addEventListener('change',()=>{const t=profT($('st').value);if(t)$('ti').value=t;calc()});
$('bm').addEventListener('change',()=>{set.bm=$('bm').value;saveSet()});$('rk').addEventListener('change',()=>{set.rk=$('rk').value;saveSet()});
$('b0').addEventListener('input',()=>{set.b0=$('b0').value;saveSet()});
$('sv').onclick=()=>{if(!$('st').value){$('msg').textContent='Scegli la strategia prima di salvare.';return}
if(!$('pa').value.trim()){$('msg').textContent='Inserisci la partita prima di salvare.';return}
calc();const lay=$('ti').value==='LAY',qs=[1,2,3,4].map(i=>[n('q'+i),n('s'+i)]).filter(x=>x[0]>0&&x[1]>0),S=qs.reduce((a,x)=>a+x[1],0),av=S?qs.reduce((a,x)=>a+x[0]*x[1],0)/S:'';
const v=i=>$(i).value,j=load();j.unshift({d:v('dt'),p:v('pa').trim(),pu:v('pu'),st:v('st'),ti:v('ti'),bm:v('bm'),rk:v('rk'),sp:v('sp'),le:v('le'),mi:v('mi'),mo:v('mo'),av,S,
rkE:cur?cur.risk:(S?(lay?S*av-S:S):''),qe:v('qe'),tu:v('tu'),em:v('em'),pl:cur?cur.pl:'',pc:cur?cur.pc:'',sr:n('sr')>0?n('sr')/100:'',ev:curEv});
localStorage.setItem(KEY,JSON.stringify(j));
['st','al','pa','le','pu','mi','mo','qe','tu','em','pl','sr'].forEach(i=>$(i).value='');for(let i=1;i<=4;i++){$('q'+i).value='';$('s'+i).value=''}
$('sp').value='1';plM=false;$('msg').textContent='Salvato nel journal.';calc();show(2)};
function render(){const j=load();$('ls').innerHTML=j.length?j.map((t,i)=>`<div class="tr"><div><b>${t.p}</b><br><small>${t.d} · ${t.st} · ${t.bm}${t.mi?' · '+t.mi+"'":''}</small></div><div style="text-align:right"><b class="${t.pl>0?'g':t.pl<0?'r':''}">${t.pl===''?'–':(t.pl>=0?'+':'')+(+t.pl).toFixed(2)+' €'}</b><br><small>${t.pc===''?'':(t.pc*100).toFixed(1)+'%'}</small> <button class="sec" onclick="del(${i})">✕</button></div></div>`).join(''):'<small>Nessun trade salvato.</small>'}
function renderStrat(){$('sl').innerHTML=strat.map((x,i)=>`<div class="tr"><div>${x.n} <small>${x.t||'–'}</small></div><div><button class="sec" onclick="rn(${i})">✎</button> <button class="sec" onclick="dl(${i})">✕</button></div></div>`).join('')}
window.rn=i=>{const o=strat[i].n,nn=(prompt('Nuovo nome',o)||'').trim();if(!nn||nn===o)return;if(strat.some(x=>x.n===nn)){alert('Esiste già una strategia con questo nome');return}
strat[i].n=nn;saveStrat();const j=load();j.forEach(t=>{if(t.st===o)t.st=nn});localStorage.setItem(KEY,JSON.stringify(j));fillSt();renderStrat();render()};
window.dl=i=>{if(!confirm('Togliere la strategia dal menu? I trade già salvati restano.'))return;strat.splice(i,1);saveStrat();fillSt();renderStrat()};
$('sa').onclick=()=>{const nn=(prompt('Nome nuova strategia')||'').trim();if(!nn||strat.some(x=>x.n===nn))return;const t=(prompt('Tipo: BACK o LAY','BACK')||'').toUpperCase();strat.push({n:nn,t:t==='LAY'?'LAY':'BACK'});saveStrat();fillSt();renderStrat()};
window.del=i=>{if(!confirm('Eliminare il trade?'))return;const j=load();j.splice(i,1);localStorage.setItem(KEY,JSON.stringify(j));render()};
const H=['Data','Partita','Punteggio','Strategia','Tipo','Bookmaker','% Rischio','Step','Lega','Min Entrata','Min Uscita','Quota media','Stake','Rischio €','Quota Uscita','Tipo Uscita','Emozione','P&L','Strike rate'];
const nu=(x,d)=>x===''||x==null?'':(+x).toFixed(d).replace('.',','),qn=x=>String(x).replace('.',',');
const line=(t,s)=>[t.d,t.p,t.pu,t.st,t.ti,t.bm,qn(t.rk),t.sp,t.le,t.mi,t.mo,nu(t.av,3),nu(t.S,2),nu(t.rkE,2),qn(t.qe||''),t.tu,t.em,nu(t.pl,2),nu(t.sr,4)].join(s);
function copy(all){const j=load(),sel=j.filter(t=>all||!t.x);if(!sel.length){alert('Nessun trade nuovo da copiare');return}
navigator.clipboard.writeText(sel.slice().reverse().map(t=>line(t,'\t')).join('\n')).then(()=>{if(!all){j.forEach(t=>t.x=1);localStorage.setItem(KEY,JSON.stringify(j))}alert('Copiati '+sel.length+' trade. Incolla nella prima riga libera del journal (colonna A).')})}
$('rz').onclick=()=>{if(!confirm('Eliminare TUTTI i trade salvati? Non si può annullare.'))return;if(!confirm('Sicuro? Hai già copiato i trade in Fogli?'))return;localStorage.removeItem(KEY);render();stats()};
$('cp').onclick=()=>copy(false);$('ca').onclick=()=>copy(true);
$('cs').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([[H.join(';')].concat(load().map(t=>line(t,';'))).join('\n')],{type:'text/csv'}));a.download='split-trader.csv';a.click()};
function stats(){const j=load().slice().reverse().filter(t=>t.pl!==''&&isFinite(+t.pl)),b0=B0();
if(!j.length){$('ch').innerHTML='<small>Nessun trade chiuso: salva trade con P&L per vedere il grafico.</small>';$('ks').innerHTML=$('bs').innerHTML='';return}
let c=b0,pk=b0,dd=0;const pts=[b0];j.forEach(t=>{c+=+t.pl;pts.push(c);pk=Math.max(pk,c);dd=Math.max(dd,pk-c)});
const mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1,W=320,Hh=150,P=8,X=i=>P+i*(W-2*P)/Math.max(pts.length-1,1),Y=v=>Hh-P-(v-mn)*(Hh-2*P)/sp;
const col=c>=b0?'#3DDC97':'#FF6B6B';
$('ch').innerHTML=`<svg viewBox="0 0 ${W} ${Hh+14}"><line x1="${P}" x2="${W-P}" y1="${Y(b0)}" y2="${Y(b0)}" stroke="#2B3648" stroke-dasharray="4"/><polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><circle cx="${X(pts.length-1)}" cy="${Y(c)}" r="4" fill="${col}"/><text x="${P}" y="${Hh+11}" fill="#8A97AB" font-size="10">min ${f2(mn)} · max ${f2(mx)}</text></svg>`;
const ee=j.filter(t=>t.ev!==''&&t.ev!=null&&isFinite(+t.ev)),evT=ee.reduce((a,t)=>a+ +t.ev,0),plE=ee.reduce((a,t)=>a+ +t.pl,0),sg=x=>(x>=0?'+':'')+f2(x)+' €';
const w=j.filter(t=>+t.pl>0).length,tot=c-b0,K=[['Trade chiusi',j.length],['Strike rate',(w/j.length*100).toFixed(1)+'%'],['P&L totale',(tot>=0?'+':'')+f2(tot)+' €'],['Bankroll attuale',b0?f2(c)+' €':'imposta il bankroll iniziale'],['Max drawdown',f2(dd)+' €'],['P&L medio',f2(tot/j.length)+' €'],['EV totale (atteso)',ee.length?sg(evT):'–'],['EV medio per trade',ee.length?f2(evT/ee.length)+' €':'–'],['Scarto P&L − EV',ee.length?sg(plE-evT):'–']];
