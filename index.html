<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151F">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Split Trader</title>
<style>
:root{--bg:#10151F;--p:#1A2230;--l:#2B3648;--t:#E8EDF5;--m:#8A97AB;--g:#3DDC97;--r:#FF6B6B;--a:#FFC14D;--b:#5BA8FF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:12px 14px 80px}
nav{display:flex;gap:8px;margin-bottom:12px}nav button{flex:1;padding:10px;border:1px solid var(--l);background:var(--p);color:var(--m);border-radius:10px;font-weight:600}
nav button.on{color:var(--t);border-color:var(--b)}
section{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:15px}
label{display:block;font-size:12px;color:var(--m);margin:6px 0 2px}
input,select,textarea{width:100%;padding:9px;background:var(--bg);border:1px solid var(--l);border-radius:8px;color:var(--t);font:inherit}
textarea{height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
button.pri{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:var(--b);color:#08101C;font-weight:700;font-size:15px}
button.sec{padding:8px 12px;border:1px solid var(--l);background:none;color:var(--t);border-radius:8px}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--m)}.kv b{color:var(--t);font-variant-numeric:tabular-nums}
.tr{border-top:1px solid var(--l);padding:8px 0;display:flex;justify-content:space-between;gap:8px}.tr small{color:var(--m)}
#msg{color:var(--m);font-size:13px;margin-top:6px}.hid{display:none}
</style></head><body><main>
<nav><button id="n1" class="on">Nuovo trade</button><button id="n2">Journal</button></nav>
<div id="v1">
<section><h2>Alert Telegram</h2>
<textarea id="al" placeholder="Incolla qui l'alert"></textarea>
<button class="pri" id="rd">Leggi alert</button><div id="msg"></div></section>
<section><h2>Trade</h2>
<div class="row"><div><label>Data</label><input type="date" id="dt"></div><div><label>Strategia</label><select id="st"></select></div></div>
<label>Partita</label><input id="pa">
<div class="row"><div><label>Lega</label><input id="le"></div><div><label>Punteggio</label><input id="pu"></div></div>
<div class="row"><div><label>Minuto ingresso</label><input id="mi" inputmode="numeric"></div><div><label>Tipo</label><select id="ti"><option>BACK</option><option>LAY</option></select></div></div>
</section>
<section><h2>Tranche (back)</h2><div id="tr"></div>
<div class="row"><div><label>Commissione %</label><input id="co" inputmode="decimal" value="5"></div><div><label>Soglia red up % stake</label><input id="rs" inputmode="decimal" value="50"></div></div>
<label>Quota di uscita (banco Over)</label><input id="qe" inputmode="decimal" placeholder="es. 1.20">
</section>
<section><div class="big" id="pc">–</div><div id="stt" class="a">Inserisci tranche e quota di uscita</div>
<div class="kv"><span>Quota media</span><b id="av">–</b></div><div class="kv"><span>Stake totale</span><b id="sk">–</b></div>
<div class="kv"><span>P&L netto</span><b id="pl">–</b></div>
<div class="kv"><span>Uscita in pareggio a</span><b id="be">–</b></div><div class="kv"><span>Red up a</span><b id="ru">–</b></div>
<button class="pri" id="sv">Salva nel journal</button></section>
</div>
<div id="v2" class="hid"><section><h2>Trade salvati</h2><div id="ls"></div>
<div class="row" style="margin-top:10px"><button class="sec" id="cp">Copia per Sheets</button><button class="sec" id="cs">Scarica CSV</button></div></section></div>
</main>
<script>
const $=i=>document.getElementById(i),KEY='splittrader_journal';
const STR=['Split Over 1.5','Split Over 2.5','Split Over 3.5','Split Over HT','Draw Balance','FHG 0.5','Lay Sfavorita','Lay The Draw','Draw Balance HT','Classic Snipe','Split Over','Over 1.5 HT','FHG Double','Over Successivo'];
const MAP=[[/SPLIT OVER/,'Split Over 1.5','BACK'],[/DRAW BALANCE/,'Draw Balance','LAY']];
$('st').innerHTML=STR.map(s=>`<option>${s}</option>`).join('');
$('tr').innerHTML=[1,2,3,4].map(i=>`<div class="row3"><span>${i}</span><input id="q${i}" inputmode="decimal" placeholder="quota"><input id="s${i}" inputmode="decimal" placeholder="stake €"></div>`).join('');
$('dt').valueAsDate=new Date();
function parse(raw){const text=raw.replace(/\r/g,''),clean=s=>s.replace(/[^\p{L}\p{N}\s.'’′\-–:&()\/]/gu,'').replace(/\s+/g,' ').trim();
const lines=text.split('\n').map(l=>l.trim()).filter(Boolean),o={partita:'',lega:'',punteggio:'',minuto:'',quota:'',tipo:'',strategia:''};
const title=clean(lines[0]||'').toUpperCase();for(const [re,s,t] of MAP)if(re.test(title)){o.strategia=s;o.tipo=t;break}
for(const l of lines)if(l.includes('🏆')){o.lega=clean(l.replace('🏆',''));break}
let m;for(const l of lines)if(m=clean(l).match(/^(.+?)\s+vs\.?\s+(.+)$/i)){o.partita=m[1]+' - '+m[2];break}
for(const l of lines){const c=clean(l);if(/^(Score|Corners|Shots|xG|Odds|Live|Kick)/i.test(c))continue;
if(m=c.match(/^(.+?)\s+(\d+)\s*[–\-:]\s*(\d+)\s+(.+)$/)){if(!o.partita)o.partita=m[1]+' - '+m[4];o.punteggio=m[2]+'-'+m[3];break}}
if(!o.punteggio&&(m=text.match(/Score(?:\s*HT)?\s*:?\s*(\d+)\s*[:\-–]\s*(\d+)/i)))o.punteggio=m[1]+'-'+m[2];
if(o.strategia==='Draw Balance')o.punteggio='0-0';
if((m=text.match(/(?:Minuto:?\s*|⏱\uFE0F?\s*)(\d+)\s*['’′]/u))||(m=text.match(/(\d+)\s*['’′]/)))o.minuto=m[1];
if(o.strategia==='Draw Balance'&&(m=text.match(/Live[^\n]*\n\s*([\d.,]+)\s*-\s*([\d.,]+)\s*-\s*([\d.,]+)/i))){o.quota=m[2].replace(',','.')}
return o}
$('rd').onclick=()=>{const o=parse($('al').value);if(!o.partita){$('msg').textContent='Partita non riconosciuta: controlla il testo incollato.';return}
$('pa').value=o.partita;$('le').value=o.lega;$('pu').value=o.punteggio;$('mi').value=o.minuto;if(o.strategia)$('st').value=o.strategia;if(o.tipo)$('ti').value=o.tipo;
if(o.quota){$('q1').value=o.quota}
$('msg').textContent='Compilato. Controlla i campi'+(o.quota?'':' e inserisci la quota delle tranche')+'.';calc()};
const n=i=>parseFloat(String($(i).value).replace(',','.')),f2=x=>isFinite(x)?x.toFixed(2):'–';
let res=null;
function calc(){let S=0,R=0;for(let i=1;i<=4;i++){const q=n('q'+i),s=n('s'+i);if(q>0&&s>0){S+=s;R+=q*s}}
const c=(n('co')||0)/100,rt=(n('rs')||50)/100,qe=n('qe');res=null;
$('sk').textContent=S?f2(S)+' €':'–';if(!S){$('av').textContent=$('be').textContent=$('ru').textContent=$('pl').textContent=$('pc').textContent='–';return}
const av=R/S;$('av').textContent=f2(av);$('be').textContent=f2(av);$('ru').textContent=f2(av/(1-rt));
if(!(qe>0)){$('pc').textContent='–';$('pl').textContent='–';$('stt').textContent='Inserisci la quota di uscita';$('stt').className='a';return}
const g=R/qe-S,net=g>0?g*(1-c):g,pc=net/S;res={S,av,qe,net,pc};
$('pc').textContent=(pc*100).toFixed(1)+'%';$('pl').textContent=(net>=0?'+':'')+f2(net)+' €';
const cls=net>0?'g':pc<=-rt?'r':'a';$('pc').className='big '+cls;$('stt').className=cls;
$('stt').textContent=net>0?'Green up':pc<=-rt?'Red up: soglia raggiunta':'In perdita, sotto soglia'}
document.querySelectorAll('#v1 input,#v1 select').forEach(e=>e.addEventListener('input',calc));
const load=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
$('sv').onclick=()=>{if(!$('pa').value.trim()){$('msg').textContent='Inserisci la partita prima di salvare.';return}
const j=load();j.unshift({d:$('dt').value,p:$('pa').value.trim(),st:$('st').value,ti:$('ti').value,le:$('le').value,pu:$('pu').value,mi:$('mi').value,
av:res?res.av:'',S:res?res.S:'',qe:res?res.qe:'',pl:res?res.net:'',pc:res?res.pc:''});
localStorage.setItem(KEY,JSON.stringify(j));$('msg').textContent='Salvato nel journal.';$('al').value='';show(2)};
function render(){const j=load();$('ls').innerHTML=j.length?j.map((t,i)=>`<div class="tr"><div><b>${t.p}</b><br><small>${t.d} · ${t.st}${t.mi?' · '+t.mi+"'":''}</small></div><div style="text-align:right"><b class="${t.pl>0?'g':t.pl<0?'r':''}">${t.pl===''?'–':(t.pl>=0?'+':'')+(+t.pl).toFixed(2)+' €'}</b><br><small>${t.pc===''?'':(t.pc*100).toFixed(1)+'%'}</small> <button class="sec" onclick="del(${i})">✕</button></div></div>`).join(''):'<small>Nessun trade salvato.</small>'}
window.del=i=>{const j=load();j.splice(i,1);localStorage.setItem(KEY,JSON.stringify(j));render()};
const H=['Data','Partita','Punteggio','Strategia','Tipo','Lega','Min ingresso','Quota media','Stake','Quota uscita','P&L','% stake'];
const rows=sep=>[H.join(sep)].concat(load().map(t=>[t.d,t.p,t.pu,t.st,t.ti,t.le,t.mi,t.av===''?'':(+t.av).toFixed(3),t.S,t.qe,t.pl===''?'':(+t.pl).toFixed(2),t.pc===''?'':(t.pc*100).toFixed(1)].join(sep))).join('\n');
$('cp').onclick=()=>navigator.clipboard.writeText(rows('\t')).then(()=>alert('Copiato: incolla in Google Sheets'));
$('cs').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows(';')],{type:'text/csv'}));a.download='split-trader.csv';a.click()};
function show(k){$('v1').classList.toggle('hid',k!==1);$('v2').classList.toggle('hid',k!==2);$('n1').className=k===1?'on':'';$('n2').className=k===2?'on':'';if(k===2)render()}
$('n1').onclick=()=>show(1);$('n2').onclick=()=>show(2);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
